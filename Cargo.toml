[workspace]
resolver = "3"
members = ["crates/salty-core", "crates/salty-server", "crates/saltyctl", "crates/salty-client", "crates/salty-launch", "crates/salty-demo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Michael Christenson II <m3talsmith@gmail.com>"]
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/salty-gull"
publish = false

[workspace.dependencies]
salty-core = { path = "crates/salty-core", version = "0.1.0", default-features = false }
salty-client = { path = "crates/salty-client", version = "0.1.0" }
saltyctl = { path = "crates/saltyctl" }
salty-launch = { path = "crates/salty-launch" }
weirdnet-update = "0.1"
weirdnet-accounts = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
zeroize = "1"
semver = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
ureq = "2"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
minisign-verify = "0.3"
minisign = "0.7"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
weirdnet-mcp = "0.1"
